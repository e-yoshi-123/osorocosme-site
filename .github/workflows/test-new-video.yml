name: Test - Process One New Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Write cookies file
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > /tmp/youtube_cookies.txt

      - name: Run pipeline for one new video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          YOUTUBE_COOKIES_FILE: /tmp/youtube_cookies.txt
        run: python scripts/process_new_video.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git diff --cached --quiet && echo "No changes" || git commit -m "test: process one new video via Claude pipeline"
          git push
