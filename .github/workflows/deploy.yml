name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    # データ更新系ワークフローはGITHUB_TOKENでcommit&pushしているため、
    # 通常のpushイベントとしては連鎖トリガーされない（無限ループ防止のGitHub Actions仕様）。
    # そのためworkflow_runで明示的に後続実行する。
    workflows:
      - "Update Video Metadata"
      - "Process Pending Videos (Claude)"
      - "Scrape @cosme Catalog"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
