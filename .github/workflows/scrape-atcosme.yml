name: Scrape @cosme Catalog

on:
  schedule:
    - cron: "0 17 * * 0" # 毎週日曜 UTC 17:00 = JST月曜2:00（残りがあれば以後は自己再トリガーで継続）
  workflow_dispatch:
    inputs:
      time_budget:
        description: "1回で処理に使う秒数の目安"
        required: false
        default: "20100"

permissions:
  contents: write
  actions: write # 残りがある場合に自分自身を再トリガーするため

concurrency:
  group: scrape-atcosme
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub Actionsの1ジョブ上限(360分)に対する安全マージン
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape @cosme (resumable)
        run: python scripts/scrape_atcosme.py --time-budget "${{ github.event.inputs.time_budget || '20100' }}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/atcosme_progress.json src/data/brands-list.json src/data/cosmetics_list.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: scrape @cosme catalog batch"
          git push

      - name: Re-trigger if brands remain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining=$(jq '.pending_urls | length' scripts/atcosme_progress.json 2>/dev/null || echo 0)
          if [ "$remaining" -gt 0 ]; then
            echo "残り${remaining}件。続けて次のジョブを起動します。"
            gh workflow run scrape-atcosme.yml
          else
            echo "全ブランド処理完了、または進捗ファイルなし。再実行しません。"
          fi
