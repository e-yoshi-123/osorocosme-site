name: Update Rakuten Links

on:
  schedule:
    - cron: "0 19 * * *" # 毎日 UTC 19:00 = JST 4:00 (動画メタデータ更新の1時間後)
  workflow_dispatch:
    inputs:
      limit:
        description: "1回で処理する最大件数"
        required: false
        default: "100"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update Rakuten links
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/update_rakuten_links.py --limit "${{ github.event.inputs.limit || '100' }}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/cosmetics_list.json src/data/videos.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update Rakuten links"
          git push
